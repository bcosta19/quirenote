[package]
name = "quirenote-gui"
version = "0.1.0"
edition = "2024"
description = "Native Rust (egui) interface for Quirenote"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
ureq = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }
poppler-rs = { version = "0.26", features = ["v0_82"] }
glib = "0.22"
cairo-rs = "0.22"
zip = { version = "5", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }
base64 = "0.22"
percent-encoding = "2"
regex = "1"
unicode-normalization = "0.1"
ab_glyph = "0.2"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
