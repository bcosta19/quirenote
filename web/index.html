<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f2eadb" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quirenote</title>
    <!--
      CSP: only the app's own scripts. It also applies to the EPUB iframes (blob:),
      blocking JavaScript embedded in books, as foliate-js requires.

    -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'self'" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
